<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style/styleGame.css">
  <title>Pilla Pilla</title>
  <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
          }
        }
      </script>
</head>

<body>

  <!-- Room code badge — only shown in online mode -->
  <div id="roomBadge">
    ROOM <span id="roomCodeText"></span>
  </div>

  <div id="canvas" class="canvas"></div>

  <div id="endMsg"></div>

  <!-- This div will serve as the black overlay -->
  <div id="blackOverlay"></div>

  <!-- Item box — top center, Mario Kart style -->
  <div id="itemBox">
    <div id="itemIcon">?</div>
    <div id="itemLabel"></div>
  </div>

  <div id="infoPanel">
    <p id="infoX">X[]</p>
    <p id="infoY">Y[]</p>
    <p id="infoZ">Z[]</p>
    <p id="infoRotation">Rotation[]</p>
  </div>

  <div id="debugPanel" style="display:none">
    <p id="dbgConnection">Connection: --</p>
    <p id="dbgPlayers">Players: --</p>
    <p id="dbgFPS">FPS: --</p>
    <p id="dbgPos">Pos: --</p>
  </div>


  <script>
    (function () {
      const mode = localStorage.getItem('gameMode');
      const code = localStorage.getItem('roomCode');
      if (mode === 'online' && code) {
        document.getElementById('roomCodeText').textContent = code;
        document.getElementById('roomBadge').style.display = 'flex';
      }
    })();
  </script>

  <script src="./dist/game.bundle.js"></script>

</body>

</html>
