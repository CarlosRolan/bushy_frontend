<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <link rel="stylesheet" href="style/styleIndex.css">
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
          }
        }
      </script>
</head>

<body>
    <div id="menu">
        <h1>BushyLaberynth</h1>
        <label>Carlos Rolán Díaz</label>

        <button id="btn-preview" onclick="showMapPreview()">Map Preview</button>

        <div class="menu-divider">Solo</div>
        <button id="btn-solo" onclick="playSolo()">Play Solo</button>

        <div class="menu-divider">Online</div>
        <button id="btn-create-room" onclick="createRoom()">Create Room</button>
        <div id="join-row">
            <input id="join-code-input" placeholder="Room code" maxlength="6" oninput="clearJoinError()" onkeydown="if(event.key==='Enter') joinRoom()">
            <button id="btn-join-room" onclick="joinRoom()">Join</button>
        </div>
        <span id="join-error"></span>
    </div>

    <div id="background"></div>

    <!-- Map preview overlay -->
    <div id="map-preview-overlay" onclick="closeMapPreview()">
        <div id="map-preview-box" onclick="event.stopPropagation()">
            <div id="map-preview-header">
                <span>Map Preview</span>
                <div id="map-preview-actions">
                    <button id="btn-new-map" onclick="generateNewMap(); showMapPreview()">New Map</button>
                    <button id="map-preview-close" onclick="closeMapPreview()">✕</button>
                </div>
            </div>
            <div id="map-preview-legend">
                <span class="legend-wall">■ Wall</span>
                <span class="legend-bush">■ Bush</span>
                <span class="legend-floor">■ Floor</span>
                <span class="legend-spawn">● Spawn</span>
                <span class="legend-star">★ Goal</span>
                <div id="ghost-count-control">
                    <span>Ghosts</span>
                    <button class="ghost-count-btn" onclick="changeGhostCount(-1)">−</button>
                    <span id="ghost-count-value">3</span>
                    <button class="ghost-count-btn" onclick="changeGhostCount(+1)">+</button>
                </div>
            </div>
            <canvas id="map-preview-canvas"></canvas>
        </div>
    </div>

    <script>
        function playSolo() {
            localStorage.setItem('gameMode', 'solo');
            window.location.href = 'game.html';
        }

        function createRoom() {
            const code = Math.random().toString(36).slice(2, 6).toUpperCase();
            localStorage.setItem('gameMode', 'online');
            localStorage.setItem('roomCode', code);
            window.location.href = 'game.html';
        }

        function joinRoom() {
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!code) {
                document.getElementById('join-error').textContent = 'Enter a room code';
                return;
            }
            localStorage.setItem('gameMode', 'online');
            localStorage.setItem('roomCode', code);
            window.location.href = 'game.html';
        }

        function clearJoinError() {
            document.getElementById('join-error').textContent = '';
        }
    </script>

    <script src="./dist/menu.bundle.js"></script>

</body>

</html>
